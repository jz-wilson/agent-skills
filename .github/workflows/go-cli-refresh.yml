name: go-cli monthly refresh

# Upgrades every go-cli template to the latest dependencies in a scratch copy
# (scripts/refresh.sh dry run: nothing in the repo changes) and reports through
# an issue: one when a template breaks, one when upgrades pass and are waiting
# for `scripts/refresh.sh --write`. Silent when nothing moved.
on:
  schedule:
    - cron: "17 9 1 * *" # 09:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: go-cli-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The minor version the templates declare; a newer minor shows up in the
      # report as a toolchain update.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go-cli/assets/tool/go.mod
          cache: false
      # The version the skill's Versions table documents; a newer release shows
      # up in the report.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true

      - name: Refresh (dry run)
        id: refresh
        run: |
          log="$RUNNER_TEMP/refresh.log"
          if go-cli/scripts/refresh.sh > "$log" 2>&1; then rc=0; else rc=$?; fi
          cat "$log"
          upgrades=$(grep -c 'upgraded:' "$log" || true)
          # Toolchain lines read "  go  go1.27.2 -> go1.27.3"; compare without the go/v prefix.
          # goreleaser and task are not installed here, so they have no "installed" side.
          newer=$(awk '/^  / && $3 == "->" && $1 != "goreleaser" && $1 != "task" {a=$2; b=$4; sub(/^(go|v)/,"",a); sub(/^(go|v)/,"",b); if (b != "" && a != b) print $1}' "$log" | tr '\n' ' ')
          if [ "$rc" -ne 0 ]; then kind=failed
          elif [ "$upgrades" -gt 0 ] || [ -n "$newer" ]; then kind=updates
          else kind=none
          fi
          {
            echo "kind=$kind"
            echo "rc=$rc"
            echo "upgrades=$upgrades"
            echo "newer=$newer"
          } >> "$GITHUB_OUTPUT"
          echo "Result: $kind (upgrades: $upgrades, newer toolchain: ${newer:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        if: steps.refresh.outputs.kind != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.refresh.outputs.kind }}
          UPGRADES: ${{ steps.refresh.outputs.upgrades }}
          NEWER: ${{ steps.refresh.outputs.newer }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$KIND" = failed ]; then
            title="go-cli refresh: a template fails with the latest dependencies"
            summary="A go-cli template no longer passes gofmt, vet, \`go test -race\` or golangci-lint after upgrading to the latest dependencies. Fix the template in \`go-cli/assets/\`, then run \`go-cli/scripts/refresh.sh --write\`."
          else
            title="go-cli refresh: dependency updates available"
            summary="${UPGRADES} module upgrade(s) pass every check${NEWER:+; newer toolchain: ${NEWER}}. Run \`go-cli/scripts/refresh.sh --write\` and update the Versions table in \`go-cli/SKILL.md\`."
          fi
          {
            echo "$summary"
            echo
            echo "Run: $RUN_URL"
            echo
            echo '<details><summary>Last 150 lines of the refresh log</summary>'
            echo
            echo '```'
            tail -n 150 "$RUNNER_TEMP/refresh.log"
            echo '```'
            echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          # One open issue per kind: comment on it if it exists, else open it.
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail the run when a template broke
        if: steps.refresh.outputs.kind == 'failed'
        run: exit 1
