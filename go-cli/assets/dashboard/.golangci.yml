version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - modernize
    - noctx
    - sloglint
    - usetesting
  settings:
    errcheck:
      # Diagnostics to stderr: nothing useful to do if the write fails.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - charm.land/lipgloss/v2.Fprint
        - charm.land/lipgloss/v2.Fprintf
        - charm.land/lipgloss/v2.Fprintln
    gosec:
      excludes:
        - G104 # unchecked errors: errcheck owns this, with the exclusions above
        - G304 # a CLI opens paths the user passed; that is the job

formatters:
  enable:
    - gofumpt
    - goimports
